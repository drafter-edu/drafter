# Documentation page manifest — the URL contract from STUDENT_DOCS_PLAN.md §5.
#
# Every planned page appears here with its final front-matter seed. The
# scaffold generator (tools/scaffold_docs.py) creates missing stub pages from
# this file, and the docs linter treats these paths as the authoritative
# sitemap: pages may gain content, but their URLs must not drift from this
# contract without a plan change.
#
# Fields per page:
#   path      docs-relative markdown file (directory URLs come from mkdocs)
#   title     page title (H1 / nav label source)
#   template  one of: tutorial, concept, how-to, component, api, example,
#             error, gallery, lesson, misconception, archetype, plus the
#             structural templates: index, reference, troubleshooting,
#             playground
#   level     L1-L4 (omitted for unleveled pages)
#   audience  S (students), T (teachers), D (developers)
#   priority  P0 (minimum viable pathway), P1 (first release), P2 (post-release)
#   outcome   one sentence: what the reader can do after this page
#   symbols   drafter API names this page is the primary documentation for
#
# Gallery seed entries (6) and teacher lesson-plan seeds (3) get slugs when
# their content phases (G, I) design them, so only their indexes appear here.
# /your-project/deploy/course-checklist/ was dropped per the Phase A decision
# log (Q10): course-specific material lives on a course-maintained page.

pages:
  # ---- Home ----
  - path: index.md
    title: Drafter
    template: index
    audience: S
    priority: P0
    outcome: Understand what Drafter is and take the right next step.

