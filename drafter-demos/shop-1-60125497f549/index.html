    <script type="text/python" id="user-code">from drafter import *
from dataclasses import dataclass


@dataclass
class Item:
    name: str
    price: int
    stock: int


@dataclass
class State:
    items: list[Item]
    coins: int
    owned: list[str]


def find_item(items: list[Item], name: str) -> Item:
    for item in items:
        if item.name == name:
            return item
    return Item("nothing", 0, 0)


@route
def index(state: State) -> Page:
    content = [
        Header("The Adventurer's Shop"),
        "You have " + str(state.coins) + " coins.\n",
        "You own:",
        BulletedList(state.owned),
        HorizontalRule()
    ]
    for item in state.items:
        if item.stock > 0:
            content.append(Button("Buy " + item.name, "purchase",
                                  [Argument("item_name", item.name)]))
            content.append(" " + str(item.price) + " coins, "
                           + str(item.stock) + " left\n")
        else:
            content.append(item.name + ": sold out\n")
    return Page(state, content)


@route
def purchase(state: State, item_name: str) -> Page:
    item = find_item(state.items, item_name)
    if state.coins < item.price:
        return Page(state, [
            "You cannot afford the " + item.name + ".\n",
            Button("Back to the shop", "index")
        ])
    state.coins = state.coins - item.price
    item.stock = item.stock - 1
    state.owned.append(item.name)
    return index(state)


assert_state(
    purchase(State([Item("rope", 5, 2)], 12, []), "rope"),
    State([Item("rope", 5, 1)], 7, ["rope"]))
assert_has(
    purchase(State([Item("crown", 100, 1)], 3, []), "crown"),
    "You cannot afford the crown.")

start_server(State([
    Item("rope", 5, 2),
    Item("lantern", 12, 1),
    Item("crown", 100, 1)
], 30, []))
</script>

  <script>
  (async () => {
    try {
      
      // Shared-runtime mode: when this page is embedded in an iframe whose
      // parent has the Drafter bundle loaded, attach to the parent's host and
      // share its single Pyodide runtime instead of booting our own. This
      // page's own document still fully encapsulates the app's HTML/CSS.
      // Falls through to the standalone boot when no host is reachable
      // (direct viewing, cross-origin parent, or an old parent bundle).
      const parentHost = (() => {
        try {
          if (window.parent === window) { return null; }
          return window.parent.Drafter?.getHost?.() ?? null;
        } catch (error) {
          return null;
        }
      })();
      if (parentHost) {
        try {
          // The host fetches from the PARENT page's URL, so every relative
          // asset URL must be made absolute against THIS document first.
          const absolute = (url) => (url ? new URL(url, window.location.href).href : url);
          const drafterPath = "drafter==2.0.0";
          await parentHost.attach({
            window: window,
            code: document.getElementById('user-code')?.textContent || '',
            instanceId: window.name ? `embed-${window.name}` : undefined,
            studentFilename: "shop-1-60125497f549.py",
            loadPackagesAutomatically: true,
            explicitPackageList: null,
            bootSettings: {
              pyodideUrl: absolute("https://cdn.jsdelivr.net/pyodide/v0.29.0/full/"),
              systemPackages: ["bakery", "pillow"],
              drafterPath: drafterPath && !drafterPath.startsWith("drafter") ? absolute(drafterPath) : drafterPath,
              mountDrafterLocally: false,
              verbose: true,
              modifiedConfiguration: window.DRAFTER_MODIFIED_CONFIGURATION,
            },
          });
          console.log("[Drafter AppServer Scaffolding] Attached to parent page's shared Pyodide runtime.");
          return;
        } catch (error) {
          // e.g. the shared runtime ships a Drafter too old for the attach
          // protocol. Booting our own runtime still works, so degrade to that.
          console.warn("[Drafter AppServer Scaffolding] Shared-runtime attach failed; falling back to standalone boot:", error);
        }
      }
      
      // 1) Load Pyodide
      await window.Drafter.setupPyodide({
        pyodideUrl: "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/",
        systemPackages: ["bakery", "pillow"],
      }, true);

      // 4) Mount Drafter either locally or remotely based on configuration
      
        const url = "drafter==2.0.0";
        await window.Drafter.mountDrafterRemote(url);
      

      // Old debugging step to dump the output of drafter directory
      // await window.Drafter.runStudentCode({code: "import os; print(os.listdir('./drafter/'))"});

      // 4) Patch Drafter
      await window.Drafter.patchPythonFeatures();

      // 5) Initial run of student's code
      await window.Drafter.startPyodideAppServerSession({
        devWsUrl: null,
        pythonUrl: "shop-1-60125497f549.py",
        inlineCode: document.getElementById('user-code')?.textContent || '',
        studentFilename: "shop-1-60125497f549.py",
        loadPackagesAutomatically: true,
        explicitPackageList: null,
      });

      // All done!
      console.log("[Drafter AppServer Scaffolding] Student Code Initialized with Pyodide:");
    } finally {
      document.getElementById('--drafter-initial-loading-white-screen').remove();
    }
  })();
