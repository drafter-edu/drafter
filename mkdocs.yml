markdown_extensions:
# hl_lines support on fences (used by the drafter-codeblocks plugin).
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.superfences
- pymdownx.details
# Callout boxes ("!!! note") used across templates.
- admonition
# Collapsible "??? note" blocks (progressive disclosure for screenshots).
- pymdownx.details
# Grid cards on index pages and attribute hooks for the design system.
- attr_list
- md_in_html

theme:
  name: material
  # Design-system layer (STUDENT_DOCS_PLAN.md §9): zone banners and the
  # front-matter page-header block live in overrides/main.html; tokens and
  # motif styling in docs/assets/drafter-theme.css.
  custom_dir: overrides
  # The Drafter blueprint "D" mark, kept subtle: header + drawer + favicon.
  logo: assets/drafter-blueprint-d.svg
  favicon: assets/drafter-blueprint-d-favicon.svg
  # System font stack (no Google Fonts request: classrooms may be offline).
  font: false
  features:
    - navigation.tabs
    - navigation.top
    # Previous/Next links at the bottom of every page, following nav order,
    # so sequential guides (Start, Deploy) always show the way onward.
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/drafter-theme.css

extra_javascript:
  - assets/drafter-theme.js

plugins:
- search
- drafter-codeblocks:
    marker: drafter
    language: python
    output_subdir: drafter-demos
    iframe_height: 430
- gen-files:
    scripts:
    - tools/gen_ref_pages.py
- literate-nav:
    nav_file: SUMMARY.md
- section-index
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          docstring_style: google
          show_source: false
          merge_init_into_class: true
