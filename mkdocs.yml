markdown_extensions:
# hl_lines support on fences (used by the drafter-codeblocks plugin).
- pymdownx.highlight
- pymdownx.superfences

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
- search
- drafter-codeblocks:
    marker: drafter
    language: python
    output_subdir: drafter-demos
    iframe_height: 430
- gen-files:
    scripts:
    - tools/gen_ref_pages.py
- literate-nav:
    nav_file: SUMMARY.md
- section-index
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
          docstring_style: google
          show_source: false
          merge_init_into_class: true

extra_css:
  - extra.css
