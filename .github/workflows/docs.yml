name: Build Documentation

# Builds the MkDocs site (docs/ + the drafter-codeblocks demo plugin) on every
# push/PR to main, and deploys it to GitHub Pages on pushes to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      # The embedded demos are compiled with `drafter --compile`, which
      # resolves its runtime assets from js/dist in a source checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install JS dependencies
        run: npm ci
        working-directory: js
      - name: Build JS bundle
        run: npm run build
        working-directory: js

      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --python 3.13

      # Documentation CI gates (STUDENT_DOCS_PLAN.md §11). Coverage is
      # report-only until Phase E, when it gains --strict.
      - name: Check docs URL contract
        run: uv run python tools/scaffold_docs.py --check

      - name: Lint docs
        run: uv run python tools/docs_lint.py

      - name: Docs coverage report
        run: uv run python tools/docs_coverage.py

      - name: Run docs fences
        run: uv run pytest tests/test_docs_fences.py -q

      - name: Build docs
        run: uv run drafter-docs build --strict

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
