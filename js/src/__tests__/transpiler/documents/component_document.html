<!DOCTYPE html>
<html>
  <head>
    <style>.panel { border: 1px solid #ccc; }</style>
  </head>
  <body>
    <header>
      Top
    </header>
    <nav>
      <a href="/home">Home</a>
    </nav>
    <main>
      <section>
        <article class="panel">
          <h1>Title</h1>
          <h2>Subtitle</h2>
          <p>
            Paragraph <span>text</span> and <code>x = 1</code>.
          </p>
          <pre>line 1
line 2</pre>
          <blockquote cite="https://example.com">
            Quoted
          </blockquote>
          <ul>
            <li>First</li>
            <li>Second</li>
          </ul>
          <ol>
            <li>One</li>
            <li>Two</li>
          </ol>
          <div>
            <img src="logo.png" width="320" height="200" alt="logo">
            <audio src="sound.mp3" autoplay muted></audio>
            <video src="video.mp4" width="640" height="360" loop>
            </video>
            <canvas id="draw" width="400" height="200"></canvas>
            <svg width="100" height="50" viewBox="0 0 100 50">
              <rect width="100" height="50" />
            </svg>
          </div>
          <label for="username">Username</label>
          <input type="text" name="username" value="alice">
          <input type="password" name="password" value="hunter2">
          <input type="checkbox" name="agree" checked>
          <input type="date" name="birthday" value="2024-01-15">
          <input type="time" name="alarm" value="08:30:00">
          <input type="datetime-local" name="meeting" value="2024-01-15T14:30">
          <input type="file" name="documents" accept=".pdf, .docx" multiple>
          <input type="hidden" name="token" value="abc123">
          <textarea name="bio" rows="3" cols="20">Hello there</textarea>
          <select name="color">
            <option value="red">Red</option>
            <option value="blue" selected>Blue</option>
          </select>
          <output name="result" for="username">Ready</output>
          <progress value="0.75" max="1"></progress>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Age</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Ada</td>
                <td>36</td>
              </tr>
              <tr>
                <td>Bob</td>
                <td>28</td>
              </tr>
            </tbody>
          </table>
          <hr>
          <br>
          <button data-nav="next_page">Continue</button>
        </article>
      </section>
      <aside>
        Side notes
      </aside>
    </main>
    <footer>
      Bottom
    </footer>
  </body>
</html>
